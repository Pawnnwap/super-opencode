name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . build
      - name: Ruff
        shell: python
        run: |
          import subprocess
          import sys

          command = [
              sys.executable, "-m", "ruff", "check", "--output-format=github",
              "app.py", "codex_compat_proxy.py", "services", "supervisor",
              "mcp_server", "checks",
          ]
          result = subprocess.run(command, capture_output=True, text=True)
          print(result.stdout, end="")
          print(result.stderr, end="", file=sys.stderr)
          if result.returncode:
              lines = (result.stderr or result.stdout).strip().splitlines()
              message = lines[0] if lines else f"exit code {result.returncode}"
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Ruff::{message}")
          raise SystemExit(result.returncode)
      - name: Bandit
        # B602/B604 cover required Windows command shims; B324 covers non-security hashes.
        run: python -m bandit -q -r app.py codex_compat_proxy.py services supervisor mcp_server -ll --skip B324,B602,B604
      - name: Tests
        run: python -m pytest checks -q -p no:cacheprovider --junitxml=test-results.xml
      - name: Annotate test failures
        if: failure()
        shell: python
        run: |
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("test-results.xml")
          if not report.exists():
              raise SystemExit
          for case in ET.parse(report).iter("testcase"):
              failure = case.find("failure")
              if failure is None:
                  continue
              name = f"{case.attrib.get('classname', '')}::{case.attrib.get('name', '')}"
              message = (failure.attrib.get("message") or failure.text or "").splitlines()[0]
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={name}::{message}")
      - name: Build
        run: python -m build
